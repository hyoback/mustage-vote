<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mu:stage 2026 강사 투표</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #f5f5f5; color: #111; min-height: 100vh; }
  .header { background: #111; color: #fff; padding: 24px 16px 20px; text-align: center; }
  .header-title { font-size: 20px; font-weight: 700; letter-spacing: 0.05em; }
  .header-sub { font-size: 12px; color: #aaa; margin-top: 4px; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .section-label { font-size: 12px; color: #888; font-weight: 500; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; font-family: inherit; transition: opacity 0.15s; }
  .btn-black { background: #111; color: #fff; }
  .btn-black:hover { opacity: 0.85; }
  .btn-outline { background: #fff; color: #111; border: 1px solid #ddd; }
  .btn-outline:hover { background: #f5f5f5; }
  .btn-sm { width: auto; padding: 8px 16px; font-size: 13px; }
  .divider { height: 1px; background: #f0f0f0; margin: 16px 0; }
  .msg { padding: 12px 14px; border-radius: 8px; font-size: 14px; margin-top: 12px; display: none; }
  .msg.show { display: block; }
  .msg-success { background: #f0fdf4; color: #166534; }
  .msg-error { background: #fef2f2; color: #991b1b; }

  /* 팀 선택 그리드 */
  .team-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .team-btn { padding: 14px 10px; border: 1.5px solid #e5e5e5; border-radius: 10px; background: #fff; font-size: 13px; font-weight: 500; cursor: pointer; text-align: center; transition: all 0.15s; font-family: inherit; color: #111; line-height: 1.4; }
  .team-btn:hover { border-color: #bbb; background: #fafafa; }
  .team-btn.selected { border-color: #111; background: #111; color: #fff; }
  .team-btn.disabled { border-color: #f0f0f0; background: #f8f8f8; color: #ccc; cursor: not-allowed; font-size: 12px; }

  /* 완료 모달 */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .modal-overlay.show { opacity: 1; pointer-events: all; }
  .modal-box { background: #fff; border-radius: 20px; padding: 36px 28px; max-width: 320px; width: 90%; text-align: center; transform: scale(0.92); transition: transform 0.2s; }
  .modal-overlay.show .modal-box { transform: scale(1); }
  .modal-icon { font-size: 52px; margin-bottom: 16px; }
  .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .modal-sub { font-size: 14px; color: #888; line-height: 1.6; margin-bottom: 24px; }

  .step { display: none; }
  .step.active { display: block; }

  .my-team-tag { display: inline-block; background: #111; color: #fff; border-radius: 6px; padding: 4px 10px; font-size: 13px; font-weight: 500; margin-bottom: 14px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">mu:stage 2026</div>
  <div class="header-sub">강사 투표</div>
</div>

<!-- 완료 모달 -->
<div class="modal-overlay" id="done-modal">
  <div class="modal-box">
    <div class="modal-icon">🏆</div>
    <div class="modal-title">투표 완료!</div>
    <div class="modal-sub" id="done-sub"></div>
    <button class="btn btn-black" onclick="document.getElementById('done-modal').classList.remove('show')">확인</button>
  </div>
</div>

<div class="wrap">

  <!-- Step 1: 본인 팀 선택 -->
  <div class="step active" id="step1">
    <div class="card">
      <div class="section-label">본인 팀을 선택해주세요</div>
      <p style="font-size:13px;color:#888;margin-bottom:14px;">본인 팀은 투표에서 제외됩니다.</p>
      <div class="team-grid" id="my-team-grid"></div>
    </div>
    <button class="btn btn-black" onclick="goToStep2()" id="next-btn" style="opacity:0.3;" disabled>다음 →</button>
  </div>

  <!-- Step 2: 투표할 팀 선택 -->
  <div class="step" id="step2">
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
        <button class="btn btn-outline btn-sm" onclick="goToStep1()">← 다시</button>
        <span class="my-team-tag" id="my-team-label"></span>
      </div>
      <div class="divider"></div>
      <div class="section-label">가장 뛰어난 팀에 투표해주세요</div>
      <p style="font-size:13px;color:#888;margin-bottom:14px;">본인 팀을 제외한 10팀 중 1팀을 선택하세요.</p>
      <div class="team-grid" id="vote-team-grid"></div>
      <div class="msg" id="vote-msg"></div>
    </div>
    <button class="btn btn-black" onclick="submitJudge()" id="submit-btn" style="margin-bottom:20px;opacity:0.3;" disabled>투표 제출하기</button>
  </div>

</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyCaSQOYuHoRCHztYApRtEscbLZ8A0uKyEs",
  authDomain: "mutudio-beta.firebaseapp.com",
  projectId: "mutudio-beta",
  storageBucket: "mutudio-beta.firebasestorage.app",
  messagingSenderId: "988959695280",
  appId: "1:988959695280:web:7564c37de3775a22147675"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const JUDGE_COL = 'muestage2026_judge';

const TEAMS = [
  'SOPHIEHEN','ASME','EVE','HINARI','CHOCOL X HALO',
  'REALEE X BELIEVE','LETDO X HAIAN','HYOS','AUSTIN','LEEKO','AZHA X ARMSEOK'
];

let myTeamIdx = null;
let voteTeamIdx = null;

// Step 1
function renderMyTeamGrid() {
  document.getElementById('my-team-grid').innerHTML = TEAMS.map((t, i) => `
    <button class="team-btn" onclick="selectMyTeam(${i})" id="mteam-${i}">
      <span style="font-size:11px;color:inherit;opacity:0.6;">${i+1}번</span><br>${t}
    </button>
  `).join('');
}

window.selectMyTeam = function(i) {
  myTeamIdx = i;
  document.querySelectorAll('#my-team-grid .team-btn').forEach((b, idx) => b.classList.toggle('selected', idx === i));
  const btn = document.getElementById('next-btn');
  btn.disabled = false;
  btn.style.opacity = '1';
};

window.goToStep1 = function() {
  document.getElementById('step1').classList.add('active');
  document.getElementById('step2').classList.remove('active');
  voteTeamIdx = null;
};

window.goToStep2 = function() {
  if (myTeamIdx === null) return;
  document.getElementById('step1').classList.remove('active');
  document.getElementById('step2').classList.add('active');
  document.getElementById('my-team-label').textContent = `내 팀: ${myTeamIdx+1}. ${TEAMS[myTeamIdx]}`;
  renderVoteGrid();
};

// Step 2
function renderVoteGrid() {
  voteTeamIdx = null;
  const submitBtn = document.getElementById('submit-btn');
  submitBtn.disabled = true;
  submitBtn.style.opacity = '0.3';

  document.getElementById('vote-team-grid').innerHTML = TEAMS.map((t, i) => {
    if (i === myTeamIdx) {
      return `<button class="team-btn disabled" disabled>
        <span style="font-size:11px;opacity:0.5;">${i+1}번</span><br>${t}<br><span style="font-size:10px;">본인 팀</span>
      </button>`;
    }
    return `<button class="team-btn" onclick="selectVoteTeam(${i})" id="vteam-${i}">
      <span style="font-size:11px;color:inherit;opacity:0.6;">${i+1}번</span><br>${t}
    </button>`;
  }).join('');
}

window.selectVoteTeam = function(i) {
  if (i === myTeamIdx) return;
  voteTeamIdx = i;
  document.querySelectorAll('#vote-team-grid .team-btn:not(.disabled)').forEach(b => b.classList.remove('selected'));
  const btn = document.getElementById('vteam-' + i);
  if (btn) btn.classList.add('selected');
  const submitBtn = document.getElementById('submit-btn');
  submitBtn.disabled = false;
  submitBtn.style.opacity = '1';
};

window.submitJudge = async function() {
  if (myTeamIdx === null || voteTeamIdx === null) return;

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '제출 중...';

  try {
    const ref = doc(db, JUDGE_COL, String(myTeamIdx));
    const existing = await getDoc(ref);
    if (existing.exists()) {
      showMsg('vote-msg', '이미 투표하셨습니다.', 'error');
      btn.disabled = false; btn.textContent = '투표 제출하기'; btn.style.opacity = '1';
      return;
    }

    await setDoc(ref, {
      judgeTeamIdx: myTeamIdx,
      judgeTeamName: TEAMS[myTeamIdx],
      voteTeamIdx: voteTeamIdx,
      voteTeamName: TEAMS[voteTeamIdx],
      ts: Date.now(),
    });

    document.getElementById('done-sub').innerHTML =
      `<strong>${TEAMS[voteTeamIdx]}</strong>에 투표했어요!<br>결과는 시상식에서 발표됩니다.`;
    document.getElementById('done-modal').classList.add('show');

  } catch(e) {
    showMsg('vote-msg', '오류가 발생했습니다. 다시 시도해주세요.', 'error');
    console.error(e);
  } finally {
    btn.disabled = false; btn.textContent = '투표 제출하기'; btn.style.opacity = '1';
  }
};

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg show msg-' + type;
}

renderMyTeamGrid();
</script>
</body>
</html>
